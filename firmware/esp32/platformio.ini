[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -Wall
lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0

[env:native]
platform = native
test_framework = unity
build_flags = 
    -DHOST_TEST
