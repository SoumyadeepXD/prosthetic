# Servo configuration and calibration parameters (Rev 2)
# Conservative defaults: min 1000 us, neutral 1500 us, max 2000 us
# Slew rates are in us per second or normalized units per second

servos:
  thumb:
    channel: 0
    model: "MG996R"
    pulse_min_us: 1000      # TODO: verify with calibrate_servos.py
    pulse_neutral_us: 1500  # TODO: verify with calibrate_servos.py
    pulse_max_us: 2000      # TODO: verify with calibrate_servos.py
    angle_min_deg: 0.0
    angle_max_deg: 90.0
    direction: 1
    max_slew_rate_deg_s: 180.0
    home_position: 0.0     # 0.0 = fully open, 1.0 = fully closed
    calibrated: false

