[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 921600
build_flags = 
    -Wall
lib_deps =
    Wire

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = 
    -DHOST_TEST
    -Iinclude
build_src_filter = 
    +<protocol.c>
    +<supervisor.c>
    -<main.cpp>
