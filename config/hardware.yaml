jetson:
  backend: mock
  i2c_bus: 7
  uart_port: /dev/ttyTHS1
  uart_baudrate: 460800
  pca9685:
    address: 64
    frequency_hz: 50
    disable_allcall: true
  tca9548a:
    address: 113
  as5600:
    address: 54
    max_retries: 3
    channels:
      finger_group:
        channel: 0
        zero_offset_deg: 0.0
        direction: 1
        calibrated: true
      wrist_flex:
        channel: 1
        zero_offset_deg: 0.0
        direction: 1
        calibrated: true
      wrist_rotate:
        channel: 2
        zero_offset_deg: 0.0
        direction: 1
        calibrated: true
      forearm_rotation:
        channel: 3
        zero_offset_deg: 0.0
        direction: 1
        calibrated: true
      wrist_bend_reserved:
        channel: 4
        zero_offset_deg: 0.0
        direction: 1
        calibrated: true
esp32:
  pins:
    i2c_sda: 21
    i2c_scl: 22
    fsr_thumb: 32
    fsr_index: 33
    fsr_middle: 34
    fsr_ring: 35
    fsr_little: 36
    pca9685_oe: 25
    estop_pin: 27
    uart_tx: 17
    uart_rx: 16
  ads1115:
    address: 72
    sample_rate_sps: 860
    channels:
      emg_flexor: 0
      emg_extensor: 1
      eeg_analog: 2
      spare: 3
timing:
  sensor_publish_rate_hz: 100
  heartbeat_rate_hz: 50
  heartbeat_timeout_ms: 250
  force_hold_ms: 100
  force_ceiling_default_adc: 3500
